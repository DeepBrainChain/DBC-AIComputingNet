[package]
name = "dbc-chain-sidecar"
version = "0.1.0"
edition = "2021"
authors = ["DeepBrainChain Foundation"]
license = "Apache-2.0"
description = "Rust subxt sidecar exposing local JSON-RPC for dbc-node (C++)"

[[bin]]
name = "dbc-chain-sidecar"
path = "src/main.rs"

[dependencies]
# Substrate / subxt — DBC mainnet runs polkadot-v0.9.43 metadata V14, which
# any subxt 0.32+ understands. We pin 0.34 (Jan 2024 release) because:
#   * it has the standalone `subxt-signer` crate, so we don't need sp-core
#     or sp-runtime as a direct dep — that side-steps the schnorrkel /
#     substrate-bip39 diamond that bites subxt 0.27 + sp-core 16.
#   * its dynamic API (subxt::dynamic::*) is stable and matches our usage.
subxt = "0.34"
subxt-signer = { version = "0.34", features = ["subxt", "sr25519"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# JSON-RPC framing — line-delimited over AF_UNIX. jsonrpsee doesn't natively
# support Unix sockets, so we implement the small JSON-RPC 2.0 envelope
# directly on tokio::net::UnixListener (see src/rpc.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
libc = "0.2"

# SCALE codec — used to decode ContainerModeInfo from chain storage. Pin
# against the version subxt 0.34 re-exports.
parity-scale-codec = { version = "3", default-features = false, features = ["derive"] }

# Persistence (nonce, last block)
rusqlite = { version = "0.31", features = ["bundled"] }

# Logging + config
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
